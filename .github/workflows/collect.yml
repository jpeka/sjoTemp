name: Hämta och publicera

on:
  schedule:
    - cron: "23 * * * *"   # varje timme (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", "sources/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta alla källor
        if: github.event_name != 'push'
        run: python scripts/collect.py

      - name: Spara nya mätvärden
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Nya mätvärden $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Inget nytt att spara."
          fi

      - name: Bygg webbplats och databas
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
